/* Layout: sticky step tracker over one content stage; each step is its own view, People map is the interactive centrepiece */
:root{
  --bg:#EEEEEE; --card:#FFFFFF; --ink:#333333; --muted:#5F5F5F; --line:#DADADA;
  --accent:#7744FF; --accent-ink:#FFFFFF; --tint:#E9E3FF;
  --green:#00EC8A; --red:#FF5363; --yellow:#FFE299; --gray:#DDDDDD; --on-state:#1F1F1F;
  --shadow:0 2px 10px rgba(51,51,51,.08);
  --font:"Share","Segoe UI",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17151C; --card:#23202B; --ink:#EDEBF2; --muted:#A9A5B5; --line:#38343F;
  --accent:#9C7BFF; --accent-ink:#17151C; --tint:#2E2548; --gray:#3A3643; --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#9C7BFF; --accent-ink:#17151C; --tint:#2E2548; --gray:#3A3643; --shadow:0 2px 10px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;margin:0;

.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(28px,4.2vw,40px);line-height:1.15;font-weight:700;text-wrap:balance}
h2{font-size:18px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.label{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}

/* tracker */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;
  display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-size:13px;font-weight:700;letter-spacing:.04em}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:0;background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;color:var(--muted);box-shadow:var(--shadow)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tab:hover{color:var(--ink)} .tab[aria-selected="true"]:hover{color:var(--accent-ink)}

main{padding-block:18px 28px}
.view{display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-direction:column;gap:8px}
.head p{max-width:70ch;color:var(--muted)}

.card{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

@media(max-width:600px){.grid4,.grid2{grid-template-columns:minmax(0,1fr)}}

/* overview step cards */
.step{display:flex;flex-direction:column;gap:10px;text-align:left;border:2px solid transparent;width:100%}
.step:hover{border-color:var(--accent)}
.step.hi{background:var(--tint);border-color:var(--accent)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.step h3{font-size:18px;line-height:1.25}
.step .win{font-size:13px;font-weight:700;color:var(--accent)}
.step .go{font-size:13px;color:var(--muted);margin-top:auto}
.budget{display:flex;flex-direction:column;gap:10px;border:2px solid var(--accent)}
.budget .q{font-size:22px;font-weight:700;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--tint);border-radius:999px;padding:5px 12px;font-size:14px}
.note{font-size:14px;color:var(--muted)}

/* align */
.sys{display:flex;flex-direction:column;gap:14px;background:var(--tint)}
.systitle{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.sysflow{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.sysflow .node{flex:1 1 200px;min-width:0;background:var(--card);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.sysflow .node.wide{flex:2 1 320px}
.sysflow .arrow{align-self:center;font-weight:700;color:var(--accent);font-size:20px}
.sysflow h3{font-size:16px}.sysflow p{font-size:14px;color:var(--muted)}
.agents,.agents ul{margin:0;padding:0;list-style:none}
.agents{display:flex;flex-direction:column;gap:8px;font-size:14px}
.agents li{display:flex;flex-direction:column;gap:1px}
.agents li>span{color:var(--muted)}
.agents ul{display:block;padding-left:16px;margin-top:2px}
.agents ul li{display:list-item;list-style:disc}
.part{display:flex;gap:12px;align-items:center;font-size:clamp(20px,2.6vw,26px);margin-top:8px}
.part span{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px;flex:0 0 auto}
.meas{display:flex;flex-direction:column;gap:12px}
.mline{font-size:18px;font-weight:700;line-height:1.3;max-width:62ch}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:700px){.mgrid{grid-template-columns:minmax(0,1fr)}}
.mgrid p{font-size:15px;margin-top:2px}
.plus{display:inline-block;vertical-align:middle;white-space:nowrap;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 16px;font-size:.55em;font-weight:700;letter-spacing:.02em}
.sysh{font-size:clamp(20px,3vw,28px)}
.gift{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.gift .g{font-weight:700;font-size:18px}
.msgline{font-size:15px;line-height:1.5}
.figcard{margin:0;padding:0;overflow:hidden}
.sysimg{display:block;width:100%;height:auto;border-radius:15px}
th.rowh{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
th.rowh.sub{font-weight:400;padding-left:32px;color:var(--muted)}
.team{display:flex;flex-direction:column;gap:10px;text-align:left;border:2px solid transparent;width:100%}
.team[aria-pressed="true"]{border-color:var(--accent)}
.team h3{font-size:17px}
.team dl{margin:0;display:flex;flex-direction:column;gap:2px}
.team dt{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.team dd{margin:0 0 6px;font-size:14px}
.team ul{margin:0;padding-left:18px;font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:center;font-size:14px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.on{color:var(--accent);font-size:18px}
.colhi{background:var(--tint)}
tbody tr:hover td{background:var(--tint)}

/* stances */

.s-advocate{background:var(--accent);color:var(--accent-ink)}
.s-supporter{background:var(--green);color:var(--on-state)}
.s-neutral{background:var(--yellow);color:var(--on-state)}
.s-detractor{background:var(--red);color:var(--on-state)}

a{color:var(--accent);font-weight:700}
.reset{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}

@media(prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

function person(p){
  const sel=state.sel===p.id?"true":"false";
  const dim=state.filter&&p.stance!==state.filter?" dim":"";
  return `<button class="person${dim}" data-p="${p.id}" aria-pressed="${sel}"><span class="nm">${esc(p.name)}</span><span class="tt">${esc(p.short)}</span>${pill(p.stance)}</button>`;
}
function counts(){const c={advocate:0,supporter:0,neutral:0,detractor:0};PEOPLE.filter(p=>p.dept!=="Other advocates").forEach(p=>c[p.stance]++);return c}
function engage(){
  const c=counts(), execs=PEOPLE.filter(p=>p.dept==="Executives");
  return `<section class="view" aria-labelledby="h">
   <div class="head"><span class="eyebrow">${SUB.engage}</span>
   <h1 id="h">Turn Neutral Executives Into Vieu Supporters</h1></div>
   <div class="goalbox">Goal: turn key executives from neutral to advocates for Vieu.<small>${c.neutral} neutral contacts today, ${execs.filter(p=>p.stance==="neutral").length} of them executives.</small></div>
   <div class="filters" role="group" aria-label="Filter by stance">${Object.keys(STANCES).map(k=>`<button class="f" data-f="${k}" aria-pressed="${state.filter===k}">${pill(k)}<span class="ct">${c[k]}</span></button>`).join("")}</div>
   <div class="dept"><span class="label">Executives</span><div class="row5">${execs.map(person).join("")}</div></div>
   <div class="depts">${DEPTS.map(d=>`<div class="dept"><span class="label">${d.name}</span><span class="sub">${esc(d.sub)}</span>${d.ids.map(i=>person(byId[i])).join("")}</div>`).join("")}</div>
   <div class="dept others"><span class="label">Other advocates for Vieu</span><span class="sub">Supporters who are not senior enough for the map above</span>
     ${OTHERS.length?`<div class="row5">${OTHERS.map(i=>person(byId[i])).join("")}</div>`:`<div class="empty">List to be added.</div>`}</div>
   <p class="note">Stances you change here are saved in this browser only. <button class="reset" data-reset>Reset to plan</button></p>
   ${modal()}
  </section>`;
}
function modal(){
  const p=byId[state.sel]; if(!p)return "";
  return `<div class="modal" data-close="1"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(p.name)}">
   <button class="x" data-close="1" aria-label="Close">×</button>
   <span class="label">${p.dept}</span><div class="nm">${esc(p.name)}</div><div class="tt">${esc(p.full)}</div>
   <div class="kv"><span class="muted">Stance toward Vieu</span><div class="seg" role="group" aria-label="Stance">${Object.keys(STANCES).map(k=>`<button data-set="${k}" aria-pressed="${p.stance===k}">${STANCES[k]}</button>`).join("")}</div></div>
   <div class="links">${p.pid?`<a href="https://www.vieu.com/home#pt=person&pid=${p.pid}" target="_blank" rel="noopener">Open in Vieu</a>`:""}<a href="${p.li}" target="_blank" rel="noopener">LinkedIn</a></div>
  </div></div>`;
}

function embed(){
  return `<section class="view" aria-labelledby="h">
   <div class="head"><span class="eyebrow">${SUB.embed}</span><h1 id="h">Embed Vieu Into Rubrik's Internal Tools</h1>
   <p>Vieu feeds Kobi, enriches Salesforce and reaches people in Slack, so reps and executives use it where they already work. Live by Jan 31.</p></div>
   <div class="flow">
    <div class="node"><span class="label">Vieu intelligence to integrate</span>
     <ul class="items"><li>Executives per account</li><li>Warm introductions</li><li>Competitor activity</li><li>New hires and promotions in that account</li><li>Social intelligence</li></ul></div>
    <div class="link"><span class="apilabel">REST APIs</span><span class="arrow" aria-hidden="true">→</span></div>
    <div class="node"><span class="label">Destination</span><h3>Kobi</h3><h3>Salesforce</h3><h3>Slack</h3></div>
   </div>
   <div class="card open now"><span class="label">Needed immediately</span>
    <p>A working session on the integration with Mo, who is based in Indianapolis.</p>
    <ul><li>Samir or Simon travels to Indianapolis to meet Mo, or taps Mo when he is at Rubrik HQ</li></ul></div>
  </section>`;
}
const ACTIONS=[
 {id:"a1",g:"Budget",t:"Confirm who the budget owner is for the renewal. Talk to Megan Gino and Sam Helberg, and make sure Vieu is a line item in next year's budget",o:["Samir"],d:"Before budget lock, end of Nov"},
 {id:"a2",g:"Align",t:"Agree the messaging for all four departments",o:["Bhavik","Samir"],d:"Now"},
 {id:"a3",g:"Align",t:"Schedule a kickoff call with Megan Gino to show the new messaging and align on impact measurement and the list of 250 accounts",o:["Bhavik","Samir"],d:"Oct"},
 {id:"a4b",g:"Engage",t:"Draft the deck for Julia Lee, Kavitha Mariappan and Jesse Green",o:["Bhavik"],d:"Early Nov"},
 {id:"a4",g:"Engage",t:"Meet Julia Lee, Kavitha Mariappan and Jesse Green",o:["Samir"],d:"Nov"},
 {id:"a5",g:"Engage",t:"Win over four VPs, one in each department, and turn them into key advocates",o:["Bhavik"],d:"Nov to Jan"},
 {id:"a6",g:"SKO 2027",t:"Confirm the SKO 2027 date and the likely agenda with Sam Helberg",o:["Samir"],d:"Nov"},
 {id:"a7",g:"SKO 2027",t:"Get 15 minutes on the main stage for Vieu's executive engagement system",o:["Samir"],d:"Before SKO 2027"},
 {id:"a8",g:"SKO 2027",t:"Attend SKO 2027",o:["Samir"],d:"Feb 2027"},
 {id:"a9",g:"Embed",t:"Meet Mo in Indianapolis, or at Rubrik HQ, coordinating with Sam Helberg and Bhavik",o:["Samir"],d:"Immediately"},
 {id:"a10",g:"Embed",t:"Integrate Vieu intelligence into Kobi, Salesforce and Slack",o:["Bhavik"],d:"By Jan 31"},
];
let aState={owner:null,done:{}};
try{aState.done=JSON.parse(localStorage.getItem("rubrik-actions-v2")||"{}")}catch(e){}
function actions(){
  const list=ACTIONS.filter(a=>!aState.owner||a.o.includes(aState.owner));
  const open=ACTIONS.filter(a=>!aState.done[a.id]);
  const cnt=o=>ACTIONS.filter(a=>a.o.includes(o)&&!aState.done[a.id]).length;
  const groups=[...new Set(list.map(a=>a.g))];
  return `<section class="view" aria-labelledby="h">
   <div class="head"><span class="eyebrow">${SUB.actions}</span><h1 id="h">What We Do Next</h1>
   <p>${open.length} of ${ACTIONS.length} open. Tick an item when it is done. Ticks are saved in this browser only.</p></div>
   <div class="filters" role="group" aria-label="Filter by owner">
     <button class="f own" data-o="" aria-pressed="${!aState.owner}"><span class="ct">All</span></button>
     ${["Samir","Bhavik"].map(o=>`<button class="f own" data-o="${o}" aria-pressed="${aState.owner===o}">${o}<span class="ct">${cnt(o)} open</span></button>`).join("")}</div>
   ${groups.map(g=>`<div class="card agroup"><h2>${g}</h2><ul class="alist">${list.filter(a=>a.g===g).map(a=>`
     <li class="${aState.done[a.id]?"done":""}"><label><input type="checkbox" data-a="${a.id}" id="chk-${a.id}" ${aState.done[a.id]?"checked":""}><span class="at">${esc(a.t)}</span></label>
     <span class="meta">${a.o.map(o=>`<span class="pill owner-${o}">${o}</span>`).join("")}<span class="due">${esc(a.d)}</span></span></li>`).join("")}</ul></div>`).join("")}
  </section>`;
}
const VIEWS={overview,align,engage,kickoff,embed,actions};

/* ---------- shell ---------- */
function current(){const h=(location.hash||"").slice(1);return VIEWS[h]?h:"overview"}
function render(){
  const cur=current();
  $("#tabs").innerHTML=STEPS.map(s=>`<button class="tab" role="tab" data-go="${s.id}" aria-selected="${s.id===cur}">${s.tab}</button>`).join("");
  const keep=window.scrollY;
  $("#main").innerHTML=VIEWS[cur]();
  document.title="Rubrik Renewal Plan";
  if(render.last!==cur){window.scrollTo(0,0)}else{window.scrollTo(0,keep)}
  render.last=cur;
}
function go(id){try{history.replaceState(null,"","#"+id)}catch(e){location.hash=id}render()}
document.addEventListener("click",e=>{
  const ow=e.target.closest("[data-o]");if(ow){aState.owner=ow.dataset.o||null;return render()}
  const t=e.target.closest("[data-go],[data-team],[data-p],[data-f],[data-set],[data-reset],[data-close]"); if(!t)return;
  if(t.dataset.close){if(e.target.closest(".dlg")&&!e.target.closest(".x"))return;state.sel=null;return render()}
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.team)state.team=state.team===t.dataset.team?null:t.dataset.team;
  else if(t.dataset.p)state.sel=t.dataset.p;
  else if(t.dataset.f)state.filter=state.filter===t.dataset.f?null:t.dataset.f;
  else if(t.dataset.set){setStance(state.sel,t.dataset.set)}
  else if(t.dataset.reset){PEOPLE.forEach(p=>p.stance=DEFAULT[p.id]);persist()}
  render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.sel){state.sel=null;render()}});
document.addEventListener("change",e=>{const c=e.target.closest("[data-a]");if(!c)return;aState.done[c.dataset.a]=c.checked;try{localStorage.setItem("rubrik-actions-v2",JSON.stringify(aState.done))}catch(x){}render()});
window.addEventListener("hashchange",render);
render();
</script>
